<!doctype html>
<html lang="en" data-app="wizard-podcasts">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Podcasts</title>
  <script src="boot.js"></script>
  <link rel="stylesheet" href="wizard-tokens.css">
  <link rel="stylesheet" href="wizard-ui.css">
  <link rel="stylesheet" href="standalone.css">
  <link rel="stylesheet" href="styles.css">
  <script defer src="/wizard-os-home/core/app-client.js"></script>
  <script defer src="wizard-sheet.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div class="wz-app pc-app">
    <div class="pc-top" id="top">
      <div id="chips" class="pc-chips" role="group" aria-label="Shows"></div>
      <button type="button" class="pc-tool" id="open-filter" aria-label="Filter and order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg><i class="pc-dot" id="filter-dot" hidden></i></button>
      <button type="button" class="pc-tool" id="open-add" aria-label="Find shows"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <main class="wz-scroll" id="main">
      <button type="button" class="pc-back" id="nav-back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
        <span>Back</span>
      </button>

      <section id="view-feed" class="pc-view" aria-label="Episodes">
        <div id="feed-groups"></div>
        <button type="button" class="wz-button secondary pc-more" id="feed-more" hidden>More</button>
        <div id="feed-empty" class="wz-empty pc-none" hidden>
          <p id="feed-empty-text"></p>
          <button type="button" class="wz-button secondary pc-gap" id="feed-empty-go" hidden></button>
        </div>
      </section>

      <section id="view-add" class="pc-view" aria-label="Find shows" hidden>
        <form id="search-form" class="pc-search" autocomplete="off" role="search">
          <input id="search-input" class="wz-field" type="search" inputmode="search" enterkeyhint="search" maxlength="400"
                 aria-label="Search shows, or paste a feed address or @handle" placeholder="Search, or paste a feed or @handle">
          <button type="button" class="pc-tool" id="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        </form>
        <p id="search-note" class="pc-note" hidden></p>
        <ul class="wz-list" id="search-results" aria-label="Results"></ul>
      </section>

      <section id="view-show" class="pc-view" aria-label="Show" hidden>
        <div class="pc-hero">
          <img id="show-art" class="pc-art pc-art-lg" alt="" hidden>
          <div class="pc-hero-text">
            <h2 id="show-title" class="pc-title"></h2>
            <p id="show-meta" class="pc-sub"></p>
          </div>
          <button type="button" class="pc-tool pc-hero-more" id="show-actions" aria-label="Show options"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3" class="pc-fill"/><circle cx="12" cy="12" r="1.3" class="pc-fill"/><circle cx="18.5" cy="12" r="1.3" class="pc-fill"/></svg></button>
        </div>
        <p id="show-error" class="pc-note pc-warn" hidden></p>
        <ul class="wz-list" id="show-episodes" aria-label="Episodes"></ul>
        <button type="button" class="wz-button secondary pc-more" id="show-more" hidden>More</button>
      </section>

      <section id="view-episode" class="pc-view" aria-label="Episode" hidden>
        <div class="pc-hero">
          <img id="ep-art" class="pc-art pc-art-lg" alt="" hidden>
          <div class="pc-hero-text">
            <button type="button" id="ep-show" class="pc-link"></button>
            <h2 id="ep-title" class="pc-title"></h2>
            <p id="ep-meta" class="pc-sub"></p>
          </div>
        </div>
        <button type="button" class="wz-button pc-play-big" id="ep-play"></button>
        <div class="wz-actions pc-actions">
          <button type="button" class="wz-button secondary" id="ep-mark"></button>
          <button type="button" class="wz-button secondary" id="ep-download"></button>
        </div>
        <p id="ep-dl-note" class="pc-note" hidden></p>
        <div id="ep-notes" class="pc-notes wz-prose"></div>
      </section>

      <section id="view-player" class="pc-view pc-player" aria-label="Now playing" hidden>
        <img id="pl-art" class="pc-art pc-art-xl" alt="" hidden>
        <div class="pc-player-text">
          <button type="button" id="pl-title" class="pc-title pc-title-btn"></button>
          <button type="button" id="pl-show" class="pc-link"></button>
          <p id="pl-date" class="pc-sub"></p>
        </div>
        <div class="pc-seek">
          <input id="pl-seek" type="range" min="0" max="100" step="1" value="0" aria-label="Position">
          <div class="pc-times"><span id="pl-pos">0:00</span><span id="pl-left">0:00</span></div>
        </div>
        <div class="pc-controls">
          <button type="button" class="pc-round" id="pl-back" aria-label="Back 15 seconds"><span>−15</span></button>
          <button type="button" class="pc-round pc-round-main" id="pl-toggle" aria-label="Play"></button>
          <button type="button" class="pc-round" id="pl-fwd" aria-label="Forward 30 seconds"><span>+30</span></button>
        </div>
        <div class="pc-speeds" role="group" aria-label="Playback speed" id="pl-speeds"></div>
        <button type="button" class="wz-button secondary pc-mark" id="pl-mark">Mark played</button>
      </section>
    </main>

    <p id="status" class="wz-status" role="status" aria-live="polite"></p>

    <footer class="pc-dock" id="dock">
      <div id="toast" class="pc-toast" role="status" aria-live="polite" hidden><span id="toast-text"></span><button type="button" id="toast-undo" class="pc-toast-btn">Undo</button></div>
      <div id="mini" class="pc-mini" hidden>
        <div class="pc-mini-bar"><i id="mini-progress"></i></div>
        <button type="button" class="pc-mini-open" id="mini-open" aria-label="Open player">
          <img id="mini-art" class="pc-art pc-art-sm" alt="" hidden>
          <span class="pc-mini-text"><b id="mini-title"></b><small id="mini-sub"></small></span>
        </button>
        <button type="button" class="pc-icon" id="mini-toggle" aria-label="Play"></button>
      </div>
    </footer>

    <audio id="audio" preload="metadata"></audio>

    <dialog class="wz-sheet" id="sheet" aria-labelledby="sheet-h">
      <h2 id="sheet-h"></h2>
      <div id="sheet-body"></div>
    </dialog>
  </div>
</body>
</html>
