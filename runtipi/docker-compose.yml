services:
  wizard-podcasts:
    image: ghcr.io/humanitylabs-org/wizard-podcasts:sha-649f976baaebb6cf54cd97e6129dc1d99a23f761@sha256:3f888a951fdba81636f8afe158bd001bc61185288f4b9969cdceda6b3b071e0f
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      PORT: '9207'
      DATA_DIR: /data
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9207}:9207']
    x-runtipi:
      is_main: true
      internal_port: 9207
x-runtipi:
  schema_version: 2
  overrides: []
