services:
  wizard-podcasts:
    image: ghcr.io/humanitylabs-org/wizard-podcasts:sha-b07deea6dabecd6539102e34ed9183e49b1e0cc7@sha256:c91bfb7d2893956c3c0d69f184538c2f800ebe3e90c95ffccbad9952cb36b9a8
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      PORT: '9207'
      DATA_DIR: /data
      # YouTube shows get audio from the music-source connector on its app link (declared in wizard.md uses).
      PODCASTS_YOUTUBE_SOURCES: wizard-youtube-music=http://wizard-youtube-music:9206
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9207}:9207']
    x-runtipi:
      is_main: true
      internal_port: 9207
x-runtipi:
  schema_version: 2
  overrides: []
