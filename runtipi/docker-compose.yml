services:
  wizard-podcasts:
    image: ghcr.io/humanitylabs-org/wizard-podcasts:sha-c21350ebe4f8cf87aa61ae978e95f9752fbb80e1@sha256:352d353aa21d7b0ca2239a06d94f187cbb7a9355daba8c11e5acfed4f9cddfc9
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      PORT: '9207'
      DATA_DIR: /data
      # YouTube shows get audio from the music-source connector on its app link (declared in wizard.md uses).
      PODCASTS_YOUTUBE_SOURCES: wizard-youtube-music=http://wizard-youtube-music:9206
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9207}:9207']
    x-runtipi:
      is_main: true
      internal_port: 9207
x-runtipi:
  schema_version: 2
  overrides: []
