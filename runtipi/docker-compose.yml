services:
  wizard-podcasts:
    image: ghcr.io/humanitylabs-org/wizard-podcasts:sha-73a661bec483f49f30f938c86e71f3e4d15b8109@sha256:336d1e44244e25cf0ddebe1af527a62f998712ded565810bb2ccfe63db03f44b
    restart: unless-stopped
    user: 1000:1000
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      PORT: '9207'
      DATA_DIR: /data
      # YouTube shows get audio from the music-source connector on its app link (declared in wizard.md uses).
      PODCASTS_YOUTUBE_SOURCES: wizard-youtube-music=http://wizard-youtube-music:9206
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      # The owner's Tailscale login(s); only the owner sees and flips feature switches (api/switches).
      WIZARD_OWNER_LOGINS: ${WIZARD_OWNER_LOGINS:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    ports: ['127.0.0.1:${APP_PORT:-9207}:9207']
    x-runtipi:
      is_main: true
      internal_port: 9207
x-runtipi:
  schema_version: 2
  overrides: []
